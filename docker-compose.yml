services:
  db:
    image: mysql:8.4
    container_name: cve-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cve
      MYSQL_USER: cve
      MYSQL_PASSWORD: cve
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-ft-min-token-size=2"]
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["cve-db:/var/lib/mysql"]
volumes:
  cve-db:
